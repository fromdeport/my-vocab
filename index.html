        body {

            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Subtle Dark Animated Background */
        .bg-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: #050505;
        }

        .blob {
            position: absolute;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.5;
            animation: float 25s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 50%;
        }

        .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: #1a1a1a; animation-delay: 0s; }
        .blob-2 { bottom: -20%; right: -10%; width: 60vw; height: 60vw; background: #111827; animation-delay: -5s; }
        .blob-3 { top: 30%; left: 40%; width: 40vw; height: 40vw; background: #1f2937; animation-delay: -10s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(5%, 10%) scale(1.05); }
            100% { transform: translate(-5%, -5%) scale(0.95); }
        }

        /* Smoked Glass Styles */
        .glass {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .glass-panel {
            background: linear-gradient(145deg, rgba(30, 30, 30, 0.8), rgba(15, 15, 15, 0.9));
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.8);
            border-radius: 16px;
        }

        /* Navigation Scrollbar */
        .nav-scroll::-webkit-scrollbar {
            height: 4px;
        }
        .nav-scroll::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }
        .nav-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        .nav-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .unit-btn {
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }
        .unit-btn.active {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            color: #f3f4f6; /* gray-100 */
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        .unit-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.03);
        }

        /* 3D Flip Cards */
        .card-scene {
            perspective: 1000px;
        }
        
        .card {
            width: 100%;
            height: 120px;
            position: relative;
            transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            transition: all 0.2s ease;
        }

        .card-front {
            background: rgba(24, 24, 27, 0.8); /* zinc-900 */
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02);
        }

        .card-front:hover {
            background: rgba(39, 39, 42, 0.9); /* zinc-800 */
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .card-back {
            background: rgba(39, 39, 42, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform: rotateY(180deg);
            color: #e5e7eb;
        }

        .en-word {
            font-size: 1.15rem;
            font-weight: 500;
            color: #f3f4f6;
            letter-spacing: 0.3px;
        }

        .ru-word {
            font-size: 1.05rem;
            font-weight: 400;
            color: #9ca3af; /* gray-400 */
        }

        .highlight-word {
            color: #93c5fd; /* soft blue-300 */
            font-weight: 500;
            background: rgba(147, 197, 253, 0.1);
            padding: 0 4px;
            border-radius: 4px;
        }
        
        .story-text {
            color: #d1d5db;
            font-size: 1.05rem;
            line-height: 1.7;
            font-weight: 300;
        }
    </style>
</head>

        // Highlight english words in the story

            let formattedStory = story;
            wordsData.forEach(wordObj => {

                btn.className = `unit-btn glass px-5 py-2 rounded-full whitespace-nowrap text-sm font-medium ${i === currentUnit ? 'active' : 'text-gray-400'}`;
                btn.innerText = `Unit ${i}`;

            const unitData = vocabularyData[currentUnit];

            storyContainer.style.opacity = 0;
            setTimeout(() => {

                back.innerHTML = `<span class="ru-word">${wordObj.ru}</span>`;

                card.appendChild(front);
                card.appendChild(back);
                cardScene.appendChild(card);
                cardsContainer.appendChild(cardScene);
            });
        }
