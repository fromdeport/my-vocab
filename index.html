<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Мой словарь</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    body{font-family:Inter,sans-serif;background:#050505;color:#d1d5db;min-height:100vh}.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#050505}.blob{position:absolute;width:50vw;height:50vw;border-radius:50%;filter:blur(100px);opacity:.45;animation:float 25s infinite alternate ease-in-out}.b1{top:-15%;left:-15%;background:#1e293b}.b2{right:-15%;bottom:-25%;background:#172554;animation-delay:-7s}@keyframes float{to{transform:translate(8%,7%) scale(1.08)}}.glass{background:rgba(20,20,20,.72);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.07)}.search{background:rgba(9,9,11,.8);border:1px solid rgba(255,255,255,.12);color:#f3f4f6;outline:none}.search:focus{border-color:rgba(147,197,253,.7);box-shadow:0 0 0 3px rgba(147,197,253,.12)}.scene{perspective:1000px}.card{position:relative;height:132px;width:100%;cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.2,.2,1)}.card.is-flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:1rem;border-radius:12px;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}.front{background:rgba(24,24,27,.9);border:1px solid rgba(255,255,255,.07)}.front:hover{background:rgba(39,39,42,.95);transform:translateY(-2px)}.back{background:rgba(39,39,42,.98);border:1px solid rgba(147,197,253,.25);color:#d1d5db;transform:rotateY(180deg)}.en{color:#f3f4f6;font-size:1.1rem;font-weight:500}.ru{color:#d1d5db;font-size:.98rem;line-height:1.45}@keyframes fade{to{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body class="antialiased pb-20">
  <div class="bg"><div class="blob b1"></div><div class="blob b2"></div></div>
  <header class="sticky top-0 z-50 glass px-4 py-4 sm:px-8"><div class="mx-auto max-w-6xl"><div class="mb-4 flex items-center justify-between gap-4"><h1 class="text-xl font-medium tracking-wide text-gray-100">Мой словарь</h1><span id="count" class="rounded-full border border-gray-800 bg-gray-900/50 px-3 py-1 text-xs text-gray-400"></span></div><label class="relative block"><span class="sr-only">Поиск слов</span><svg class="pointer-events-none absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m21 21-4.35-4.35m2.35-5.15a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg><input id="search" class="search w-full rounded-xl py-3 pl-12 pr-4 text-base placeholder:text-gray-600" type="search" placeholder="Поиск на английском, русском или узбекском…" autocomplete="off"></label></div></header>
  <main class="mx-auto max-w-6xl px-4 pt-8 sm:px-8"><p class="mb-6 text-sm text-gray-500">Нажми на карточку, чтобы увидеть перевод.</p><div id="cards" class="grid grid-cols-2 gap-4 sm:gap-5 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5"></div><p id="empty" class="hidden py-16 text-center text-gray-500">Ничего не найдено. Попробуй другое слово.</p></main>
  <script>
    const vocabulary=[
      ['chain','цепь, цепочка (имеет разные смыслы)'],['woven','tikilgan, тканный'],['a mention of','упоминание о том'],['goods (n)','товары'],['chain of stores','сеть магазинов'],['venerable','почтенный, уважаемый; заслуживающий уважения благодаря возрасту или заслугам'],['fostered','развивал, поддерживал, формировал'],['established the business','основал бизнес'],['can be attributed to','можно объяснить чем-либо / приписать чему-либо'],['right from the outset','boshidan'],['not entirely','не полностью'],['worldwide','в масштабах всего мира'],['ensured','обеспечил'],['retailer','розничный продавец'],['aspect','сторона, часть или характеристика чего-либо, которую можно рассматривать отдельно'],['bold move','смелый шаг'],['won Farmers a devoted following','завоевало для Farmers преданную аудиторию / круг верных поклонников'],['devoted following','верные поклонники'],['emphasize','подчёркивать, акцентировать внимание, придавать особое значение'],['according','согласно, в соответствии с'],['embody','воплощать, олицетворять, выражать собой определённую идею или качество'],['considerably','значительно, существенно, в considerable степени'],['fiancée','невеста (женщина, с которой помолвлен)'],['fiancé','жених (мужчина, с которым помолвлена)'],['set up','организовал, основал, создал'],['overseas','за границей, за рубежом'],['up-to-date fashions','современную, актуальную модную одежду'],['buying officers','сотрудники по закупкам (люди, которые выбирают и закупают товары)'],['according to employees','по словам сотрудников / согласно мнению сотрудников']
    ];
    const cards=document.querySelector('#cards'),empty=document.querySelector('#empty'),count=document.querySelector('#count'),search=document.querySelector('#search');
    function render(query=''){const q=query.trim().toLocaleLowerCase(),shown=vocabulary.filter(([en,ru])=>`${en} ${ru}`.toLocaleLowerCase().includes(q));cards.innerHTML='';empty.classList.toggle('hidden',shown.length!==0);count.textContent=q?`Найдено: ${shown.length}`:`Слов: ${vocabulary.length}`;shown.forEach(([en,ru],i)=>{const scene=document.createElement('div');scene.className='scene';scene.style.cssText=`opacity:0;transform:translateY(15px);animation:fade .4s ease forwards ${i*.025}s`;const card=document.createElement('button');card.type='button';card.className='card';card.setAttribute('aria-label',`Показать перевод: ${en}`);card.innerHTML='<span class="face front"><span class="en"></span></span><span class="face back"><span class="ru"></span></span>';card.querySelector('.en').textContent=en;card.querySelector('.ru').textContent=ru;card.addEventListener('click',()=>card.classList.toggle('is-flipped'));scene.append(card);cards.append(scene)})}
    search.addEventListener('input',event=>render(event.target.value));render();
  </script>
</body>
</html>
